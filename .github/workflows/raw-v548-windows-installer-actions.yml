name: RAW V5.48 Windows x64 Installer (TEST artifact)

on:
  push:
    branches:
      - feature/raw-v548-windows-installer-actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raw-v548-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 EXE / unsigned LOCAL TEST
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested V5.47-derived source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install root dependencies for offline control-map QA
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Validate V5.47 mapping before packaging
        shell: pwsh
        run: node --test tests/raw-v547-full-surface.test.mjs tests/raw-v546-official-plugin-pilot.test.mjs
      - name: Stage allowlisted LOCAL TEST desktop files
        shell: pwsh
        run: node scripts/raw-v537-package-desktop.mjs
      - name: Build RAW icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/raw-v537-create-icons.py
      - name: Install pinned beta packager
        working-directory: desktop-beta
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Build unsigned NSIS EXE (no release)
        working-directory: desktop-beta
        shell: pwsh
        env:
          RAW_TEST_MODE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows
      - name: Verify EXE and output SHA256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "desktop-beta/dist" -Filter "*.exe" -File)
          if ($files.Count -ne 1) { throw "Expected exactly one EXE, got $($files.Count)" }
          $file = $files[0]
          if ($file.Length -lt 1000000) { throw "EXE unexpectedly small" }
          Get-FileHash $file.FullName -Algorithm SHA256 | Format-List
          "Installer: $($file.Name) — bytes: $($file.Length)" | Write-Host
      - name: Upload test installer to GitHub Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RAW-V548-Windows-x64-UNSIGNED-TEST
          path: desktop-beta/dist/*.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
