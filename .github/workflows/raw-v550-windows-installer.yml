name: RAW V5.50 Windows x64 Test Installer
on:
  push:
    branches:
      - feature/raw-v550-eq1-full-range-calibration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-v550-win-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - shell: pwsh
        run: node --test tests/raw-v550-eq1-calibration.test.mjs tests/raw-v549-eq1-calibration.test.mjs tests/raw-v547-full-surface.test.mjs
      - shell: pwsh
        run: node scripts/raw-v537-package-desktop.mjs
      - shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/raw-v537-create-icons.py
      - shell: pwsh
        working-directory: desktop-beta
        run: npm install --no-audit --no-fund
      - shell: pwsh
        working-directory: desktop-beta
        env:
          RAW_TEST_MODE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows
      - name: Hash and verify unsigned test EXE
        shell: pwsh
        run: |
          $exes=@(Get-ChildItem desktop-beta/dist -Filter '*.exe' -File)
          if($exes.Count -ne 1) { throw "Expected exactly one EXE" }
          if($exes[0].Length -lt 1000000) { throw "EXE unexpectedly small" }
          Get-FileHash -Algorithm SHA256 $exes[0].FullName | Format-List
      - name: Upload private-beta test executable (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RAW-V550-Windows-x64-UNSIGNED-TEST
          path: desktop-beta/dist/*.exe
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
