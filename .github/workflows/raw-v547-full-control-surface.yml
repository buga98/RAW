name: RAW v5.47 Full Control Surface

on:
  push:
    branches:
      - feature/raw-v547-full-control-surface
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-raw-midi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without Electron/runtime native postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Verify full surface and 3 vendor profile dry run plus legacy
        run: npm run studio:plugin:v547:check
# No original VST3 binary, Cubase or physical hardware in CI.
