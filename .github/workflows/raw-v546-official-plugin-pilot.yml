name: RAW v5.46 Official Plugin Pilot
on:
  push:
    branches:
      - feature/raw-v546-official-plugin-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cubase-pilot-lab:
    name: Plugin Pilot (NO real Cubase/device)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install lab dependencies without running native postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Three isolated original-plugin CC profiles, same remote-client check on all OS
        run: npm run studio:plugin:v546:check
# Automated runs test LOCAL MIDI mapping and cross-platform localhost WebSocket clients, not Cubase or vendor devices.
