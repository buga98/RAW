name: RAW V5.43 Mac Digital Mastering Acceptance (PRIVATE)
on:
  push:
    branches:
      - feature/raw-v543-mastering-acceptance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raw-v543-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-digital-acceptance:
    name: Local digital end-to-end / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies without native hooks
        run: npm ci --ignore-scripts
      - name: Verify real RAW PCM processing, .rawproj recovery and exported 24/16-bit SHA256 receipts
        run: npm run studio:acceptance:v543:check
      # Does not upload generated user/audio files, install a DMG, sign, deploy,
      # touch hardware, connect a studio, or use production billing.
