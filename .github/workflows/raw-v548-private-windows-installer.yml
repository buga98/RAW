name: RAW V5.48 Private Internet Pilot Windows Installer
on:
  push:
    branches:
      - feature/raw-v548-internet-gateway-pilot
  pull_request:
    branches:
      - feature/raw-v547-full-control-surface
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raw-v548-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Verify authenticated relay protocol
        run: node --test tests/raw-v548-relay-gateway.test.mjs
      - name: Verify existing MIDI routing and local Bridge
        run: npm run studio:plugin:v547:check
      - name: Stage private RAW Electron pilot
        run: node scripts/raw-v537-package-desktop.mjs
      - name: Generate original RAW taskbar icon
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/raw-v537-create-icons.py
      - name: Give private pilot a distinguishable version and installer filename
        shell: pwsh
        run: |
          $path='desktop-beta/package.json'
          $p=Get-Content $path -Raw | ConvertFrom-Json
          $p.version='0.548.0'
          $p.build.win.artifactName='RAW-V548-PRIVATE-PILOT-Windows-x64.${ext}'
          $p | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
      - name: Build unsigned x64 Windows NSIS installer
        working-directory: desktop-beta
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run build:windows
      - name: Verify generated installer
        shell: pwsh
        run: |
          $f=Get-ChildItem 'desktop-beta/dist/*.exe' | Select-Object -First 1
          if (-not $f -or $f.Length -lt 1000000) { throw 'RAW_INSTALLER_MISSING' }
          Get-FileHash $f.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: RAW-V548-PRIVATE-Windows-x64-Installer
          path: desktop-beta/dist/*.exe
          retention-days: 7
          if-no-files-found: error
