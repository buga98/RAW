name: RAW V5 Offline Audio QA
on:
  push:
    branches:
      - feature/studio-audio-worker-v5
      - feature/raw-v529-trusted-sessions
      - feature/raw-v531-firebase-wallet-stripe
      - feature/raw-v532-firebase-stripe-staging
      - feature/raw-v533-studio-lease-billing-safety
      - feature/raw-v534-customer-ui-qa-separation
      - feature/raw-v535-digital-master-delivery
  pull_request:
    branches:
      - feature/studio-audio-worker-v5
      - feature/raw-v528-integrated-local-acceptance
      - feature/raw-v529-trusted-sessions
      - feature/raw-v531-firebase-wallet-stripe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcm-tests:
    name: PCM test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without install-time binary hooks
        run: npm ci --ignore-scripts
      - name: V5 and V5.1 offline audio regression
        run: npm run studio:audio:v5:check
      - name: V5.29 trusted booking auth and tenant-isolation tests
        run: npm run security:v529:check
      - name: V5.31 signed Stripe wallet and trusted processing tests
        run: npm run security:v531:check
      - name: V5.32 staging guard, wallet rules and checkout throttling
        run: npm run security:v532:check
      - name: Package audited Cloud Functions code and verify syntax
        run: |
          npm run studio:firebase:v532:package
          node --check functions-v532/index.mjs
      - name: V5.33 signed studio agent lease and stop safety
        run: npm run security:v533:check
      - name: V5.34 customer view and developer QA separation
        run: npm run studio:ux:v534:check
      - name: V5.35 owner-only signed digital delivery and integrity
        run: npm run security:v535:check
      - name: Full RAW unit and contract smoke suite
        run: npm run test:smoke
