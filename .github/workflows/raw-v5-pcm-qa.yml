name: RAW V5 Offline Audio QA
on:
  push:
    branches:
      - feature/studio-audio-worker-v5
      - feature/raw-v529-trusted-sessions
      - feature/raw-v531-firebase-wallet-stripe
      - feature/raw-v532-firebase-stripe-staging
      - feature/raw-v533-billing-reliability
      - feature/raw-v534-token-wallet-lab
      - feature/raw-v535-hardware-readiness
      - feature/raw-v536-studio-calibration
      - feature/raw-v537-site-desktop-distribution
      - feature/raw-v538-desktop-beta-stability
      - feature/raw-v539-local-windows-installer
      - feature/raw-v540-unified-windows-icons
      - feature/raw-v541-macos-private-beta
      - feature/raw-v542-platform-installer-selector
      - feature/raw-v543-mastering-acceptance
  pull_request:
    branches:
      - feature/studio-audio-worker-v5
      - feature/raw-v528-integrated-local-acceptance
      - feature/raw-v529-trusted-sessions
      - feature/raw-v531-firebase-wallet-stripe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcm-tests:
    name: PCM test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without install-time binary hooks
        run: npm ci --ignore-scripts
      - name: V5 and V5.1 offline audio regression
        run: npm run studio:audio:v5:check
      - name: V5.29 trusted booking auth and tenant-isolation tests
        run: npm run security:v529:check
      - name: V5.31 signed Stripe wallet and trusted processing tests
        run: npm run security:v531:check
      - name: V5.32 staging guard, wallet rules and checkout throttling
        run: npm run security:v532:check
      - name: Package audited Cloud Functions code and verify syntax
        run: |
          npm run studio:firebase:v532:package
          node --check functions-v532/index.mjs
      - name: V5.33 studio physical fail-closed policy and accounting audit
        run: npm run security:v533:check
      - name: V5.34 in-memory RAW token countdown and owner-only LAB
        run: npm run studio:wallet:v534:check
      - name: V5.35 read-only Windows hardware readiness contract
        run: npm run studio:hardware:v535:check
      - name: V5.36 imported real WAV calibration analysis tests
        run: npm run studio:calibration:v536:check
      - name: V5.37 responsive website, locked downloads and beta installer safety
        run: npm run site:v537:check
      - name: Stage private Electron client with all local assets
        run: npm run desktop:v537:package
      - name: V5.38 nested Electron boot + offline-only installer audit
        run: npm run desktop:v538:check
      - name: V5.39 local Windows-only installer build policy
        run: npm run desktop:v539:check
      - name: V5.40 unified Windows EXE/taskbar/installer icon contract
        run: npm run desktop:v540:check
      - name: V5.41 Mac platform contract and v5.42 OS-version selector
        run: npm run desktop:v542:check
      - name: V5.43 full mastering project save/reopen and WAV export acceptance
        run: npm run studio:acceptance:v543:check
      - name: Full RAW unit and contract smoke suite
        run: npm run test:smoke
      - name: V5.39 Windows NSIS EXE build smoke (unsigned, never uploaded)
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/feature/raw-v539-local-windows-installer' || github.ref == 'refs/heads/feature/raw-v540-unified-windows-icons')
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed" }
          python scripts/raw-v537-create-icons.py
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }
          Push-Location desktop-beta
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Desktop dependencies failed" }
            npm run build:windows
            if ($LASTEXITCODE -ne 0) { throw "Unsigned NSIS build failed" }
            $installer = Get-ChildItem -Path dist -Filter 'RAW-Desktop-Beta-*-Windows-x64.exe' -File |
              Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if ($null -eq $installer -or $installer.Length -lt 1000000) {
              throw "Expected private NSIS installer missing or too small"
            }

            if ("${{ github.ref }}" -eq 'refs/heads/feature/raw-v540-unified-windows-icons') {
              & ../scripts/raw-v540-verify-windows-icon.ps1 -ExePath 'dist/win-unpacked/RAW Desktop Beta.exe' -IconPath 'build/icon.ico'
              if (-not $?) { throw "RAW V5.40 Windows EXE icon verification failed" }
            }
            Write-Host ("Unsigned NSIS PASS (not uploaded): " + $installer.Name + ", " + $installer.Length + " bytes")
          } finally {
            Pop-Location
          }

