name: RAW V5 Offline Audio QA
on:
  push:
    branches:
      - feature/studio-audio-worker-v5
      - feature/raw-v529-trusted-sessions
      - feature/raw-v530-self-hosted-mariadb
  pull_request:
    branches:
      - feature/studio-audio-worker-v5
      - feature/raw-v528-integrated-local-acceptance
      - feature/raw-v529-trusted-sessions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcm-tests:
    name: PCM test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without install-time binary hooks
        run: npm ci --ignore-scripts
      - name: V5 and V5.1 offline audio regression
        run: npm run studio:audio:v5:check
      - name: V5.29 trusted booking auth and tenant-isolation tests
        run: npm run security:v529:check
      - name: V5.30 MySQL local identity and booking regression
        run: npm run security:v530:check
      - name: Full RAW unit and contract smoke suite
        run: npm run test:smoke
