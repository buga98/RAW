name: RAW local bridge checks
on:
  push:
    branches: [ "feature/**" ]
  pull_request:
    branches: [ main ]
jobs:
  bridge-tests:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Unit and regression tests
        run: npm run test:smoke
      - name: Bridge dry-run integration test
        run: npm run bridge:check
      - name: Two-client exclusive studio lab test
        run: npm run studio:lab:check
