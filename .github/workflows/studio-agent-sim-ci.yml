name: RAW Studio Simulator V2 tests

on:
  push:
    branches:
      - feature/studio-agent-simulator-v2
      - feature/studio-state-reconciliation-v3
      - feature/studio-gateway-v1-outbound-agent
      - feature/electron-security-preload-v1
      - feature/local-audio-print-and-chain-archive-v1
      - feature/chain-recall-planner-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-studio-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install without native build scripts or Electron download
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Simulator unit and two-client WebSocket tests
        run: npm run studio:agent:check
      - name: Authenticated loopback Gateway and outbound Agent
        run: npm run studio:gateway:check
      - name: Live loopback demonstration with ephemeral credentials
        run: npm run studio:gateway:demo
      - name: Electron preload sandbox and IPC security
        run: npm run security:electron:check
      - name: Local WAV output and chain archive regression tests
        run: npm run studio:local-assets:check
      - name: Existing RAW smoke regression tests
        run: npm run test:smoke
