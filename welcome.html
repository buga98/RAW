<!DOCTYPE html>
<html>
<head>
<title>Welcome</title>
</head>
<body>

<h1 id="msg">Loading...</h1>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3LBWoS-uX9BnxDaMzQs_rlh9BMm_RRTM",
  authDomain: "remoteaudioworkstation.firebaseapp.com",
  projectId: "remoteaudioworkstation",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    window.location.href="index.html";
    return;
  }

  const snap=await getDoc(doc(db,"users",user.uid));
  const data=snap.data();

  document.getElementById("msg").innerText=
    "Dobrodošao " + data.ime + " " + data.prezime;
});
</script>

</body>
</html>
